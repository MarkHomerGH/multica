# Grandin Holdings deployment override (homer-studio, Tailnet-only, synthetic spike).
# Layer order: docker-compose.selfhost.yml -> docker-compose.selfhost.build.yml -> this file.
#
# Every lockdown value below is a LITERAL, not a ${VAR} from .env, so an upgrade
# or a stray .env edit cannot reset it (audit condition A2,
# homer-workspace docs/audit/multica/REVIEW.md). Private values (secrets, email,
# tailnet host) come from the git-ignored .env and are REQUIRED (:?) so the stack
# refuses to start without them.
#
# NOTE: upstream's compose does not pass ANALYTICS_DISABLED to the backend at all
# (v0.6.1), so setting it in .env alone is a silent no-op. It is added here.

services:
  postgres:
    # Third-party image pinned by digest, never a mutable tag (A1).
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}

  backend:
    # Built locally from the pinned fork commit (A1); never ghcr :latest.
    image: grandin/multica-backend:${GRANDIN_PIN:?set GRANDIN_PIN in .env}
    build:
      args:
        VERSION: grandin-${GRANDIN_PIN}
        COMMIT: ${GRANDIN_PIN}
    environment:
      DATABASE_URL: postgres://multica:${POSTGRES_PASSWORD}@postgres:5432/multica?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_ENV: production
      MULTICA_DEV_VERIFICATION_CODE: ""
      # A2 telemetry / analytics
      DO_NOT_TRACK: "1"
      ANALYTICS_DISABLED: "1"
      # A2 external services all off
      REDIS_URL: ""
      S3_BUCKET: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      MULTICA_CLOUD_URL: ""
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_APP_SLUG: ""
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_WEBHOOK_SECRET: ""
      MULTICA_LLM_API_KEY: ""
      MULTICA_LLM_BASE_URL: ""
      MULTICA_PLUGIN_SECRET_KEY: ""
      MULTICA_LARK_SECRET_KEY: ""
      MULTICA_SLACK_SECRET_KEY: ""
      MULTICA_DINGTALK_SECRET_KEY: ""
      MULTICA_WECOM_SECRET_KEY: ""
      MULTICA_TELEGRAM_SECRET_KEY: ""
      MULTICA_VCS_INTEGRATION_ENABLED: "false"
      MULTICA_VCS_SECRET_KEY: ""
      MULTICA_PUBLIC_URL: ""
      # A3 Tailnet origin only
      FRONTEND_ORIGIN: ${TAILNET_ORIGIN:?set TAILNET_ORIGIN in .env}
      CORS_ALLOWED_ORIGINS: ${TAILNET_ORIGINS:?set TAILNET_ORIGINS in .env}
      MULTICA_APP_URL: ${TAILNET_ORIGIN}
      GOOGLE_REDIRECT_URI: ""
      COOKIE_DOMAIN: ""
      MULTICA_TRUSTED_PROXIES: "127.0.0.1/32"
      # A4 signup door: allowlist only, no open signup, no extra domains
      ALLOW_SIGNUP: "false"
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS in .env}
      ALLOWED_EMAIL_DOMAINS: ""
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}

  frontend:
    image: grandin/multica-web:${GRANDIN_PIN}
    build:
      args:
        NEXT_PUBLIC_APP_VERSION: grandin-${GRANDIN_PIN}
    environment:
      REMOTE_API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      DOCS_URL: ""
